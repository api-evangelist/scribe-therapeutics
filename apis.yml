aid: scribe-therapeutics
name: Scribe Therapeutics
description: >-
  Scribe Therapeutics is a clinical-stage biotechnology company founded in 2018 and
  headquartered in Alameda, California, engineering CRISPR-based genetic medicines
  through its proprietary "CRISPR by Design" platform. Co-founded by molecular
  engineers Benjamin Oakes, Brett Staahl, and David Savage alongside CRISPR co-inventor
  Jennifer Doudna, the company builds highly engineered CasX-derived enzymes — including
  its X-Editing (XE) molecules for precise gene editing and ELXR epigenetic long-term
  X-repressor technology for durable gene silencing without altering the underlying DNA
  sequence. Scribe focuses initially on cardiometabolic disease, the leading cause of
  death globally, and expands into areas such as sickle cell disease and neurological
  conditions through strategic pharmaceutical partnerships. The company is backed by
  a16z and Menlo Ventures and was surfaced to the API Evangelist network as a venture
  portfolio company. Scribe Therapeutics is a therapeutics and drug-discovery company
  and does not currently publish a public developer API, SDK, or documented API surface.
